# =====================================================================
# Publications
#
# Rendered by _includes/publications.md, newest first.
#
# Supported fields per entry:
#   title            - paper title (required)
#   authors          - HTML string; wrap your own name in <strong>...</strong>
#   conference_short - abbreviated venue + year only, e.g. "CVPR, 2025"
#                       (use "Preprint, <year>" for unpublished work).
#                       This is also shown as the badge on the teaser image.
#   image            - teaser image path (optional)
#   pdf              - link to the paper (optional)
#   code             - link to the code repository (optional)
#   page             - link to a dedicated project page (optional)
#   blog             - link to a blog post about the paper (optional)
#
# The title links to `page` if present, otherwise `pdf`.
#
# NOTE: BibTeX buttons and the red "status" tag (e.g. "Oral", "Early
# Accept") used by the upstream theme are intentionally not rendered,
# and the paper abstract/introduction text is intentionally omitted.
# See _includes/publications.md for how to re-enable them.
#
# To add a new paper, copy the template below, fill it in, and place it
# at the top of the "main" list (newest first).
#
#   - title: ""
#     authors: ""
#     conference_short: ""
#     image:
#     pdf:
#     code:
#     page:
#     blog:
# =====================================================================

