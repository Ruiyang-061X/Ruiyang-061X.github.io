    period: "2025.10 - Now"
    location: "Shenzhen, China"
    description: Developing a long-horizon multimodal search agent via reinforcement learning (RL).
    project: "VSearcher"
    project_link: https://arxiv.org/abs/2603.02795

  - role: "Research Intern @ Shanghai AI Lab"
    period: "2025.05 - 2025.09"
    location: "Shanghai, China"
    description: Leveraging RL to incentivize sketch-style reasoning in large multimodal models.
    project: "SketchThinker-R1"
