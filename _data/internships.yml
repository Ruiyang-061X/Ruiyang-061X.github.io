# =====================================================================
# Internships
#
# Rendered by _includes/internship.md, newest first. Card layout
# mirrors Publications (image column + details column), but the image
# is a plain company logo with no badge overlay.
#
# Supported fields per entry:
#   role        - position and host, e.g. "Research Intern @ IDEA" (required)
#   period      - e.g. "2025.10 - 2026.3" or "2026.6 -" for ongoing
#   city        - e.g. "Shenzhen"
#   country     - e.g. "China"
#   image       - company logo path (optional)
#   topics      - one-line summary of the work/topic
#   project     - label for the related project (optional)
#   project_link- link for the related project (optional)
#
# To add a new internship, copy the template below, fill it in, and
# place it at the top of the "main" list (newest first).
#
#   - role: ""
#     period: ""
#     city: ""
#     country: ""
#     image:
#     topics: ""
#     project:
#     project_link:
# =====================================================================

